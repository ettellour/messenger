# Сертификат и перенаправление с HTTP на HTTPS настраиваются отдельно, например через certbot.
#
# Host берётся из $http_host, а не из $host: $host отбрасывает порт, и на любом порту,
# кроме 443, сокет получит отказ.
# Заголовки повторены в обоих location: nginx не наследует proxy_set_header сверху
# в блок, где задан хотя бы один свой.
# Без client_max_body_size nginx не пропустит файлы больше 1 МБ.

server {
  listen 443 ssl;
  server_name example.com;
  ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
